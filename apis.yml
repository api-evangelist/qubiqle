aid: qubiqle
name: Qubiqle
description: >-
  Qubiqle is an early 500 Startups (500 Global) portfolio company that became
  Plate IQ and today operates as Ottimate (qubiqle.com redirects to ottimate.com).
  Ottimate is an AI-powered accounts payable (AP) automation platform for invoice
  capture, GL coding and matching, approval workflows, and vendor payments,
  processing 40M+ invoices and $30B+ in payables annually across 30,000+ US
  locations. It exposes a REST/JSON V1 API (api.ottimate.com/v1, sandbox at
  sandbox-api.ottimate.com/v1) covering accounts, vendors, dimensions, purchase
  orders, receipts, invoices, catalog, and async batch processing — secured with
  an X-Api-Key header plus an OAuth2 client_credentials bearer token, with
  documented idempotency, pagination, rate limits, and a hosted docs MCP server.
